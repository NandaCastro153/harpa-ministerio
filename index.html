<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Harpa</title>
<meta name="application-name" content="Harpa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Harpa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0A0A">
<meta name="description" content="Ministério de Louvor">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:       #0A0A0A;
  --bg2:      #111111;
  --bg3:      #1A1A1A;
  --bg4:      #222222;
  --surface:  #161616;
  --gold:     #C8A84B;
  --gold2:    #F0D080;
  --gold-bg:  rgba(200,168,75,0.10);
  --gold-bdr: rgba(200,168,75,0.25);
  --text:     #FFFFFF;
  --text2:    #A0A0A0;
  --text3:    #606060;
  --text4:    #303030;
  --red:      #E05555;
  --teal:     #4ECDC4;
  --blue:     #5B8EE6;
  --purple:   #9B8EC4;
  --green:    #5CB85C;
  --r:        12px;
  --rl:       18px;
  --nav-h:    64px;
  --top-h:    56px;
}
html,body,#root{height:100%;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif;color:var(--text);overflow:hidden}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}

/* ── Layout ── */
.shell{display:flex;height:100vh;flex-direction:column}
.topbar{height:var(--top-h);background:var(--bg);border-bottom:1px solid var(--bg3);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;position:sticky;top:0;z-index:10}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;flex:1}
.topbar-sub{font-size:12px;color:var(--text3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding:20px 20px 100px}
.bottomnav{height:var(--nav-h);background:rgba(10,10,10,0.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bg3);display:flex;align-items:stretch;padding-bottom:env(safe-area-inset-bottom);position:fixed;bottom:0;left:0;right:0;z-index:20}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;color:var(--text3);padding:8px 4px;transition:color 0.15s;position:relative}
.nav-btn.active{color:var(--gold)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.5}
.nav-dot{position:absolute;top:8px;right:calc(50% - 18px);width:6px;height:6px;border-radius:50%;background:var(--red)}

/* ── Cards ── */
.card{background:var(--surface);border:1px solid var(--bg3);border-radius:var(--r);padding:16px}
.card-sm{background:var(--bg2);border:1px solid var(--bg3);border-radius:var(--r);padding:12px}
.card-title{font-size:13px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:14px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border-radius:50px;font-size:14px;font-weight:600;transition:all 0.15s;cursor:pointer}
.btn-gold{background:var(--gold);color:#000}
.btn-gold:hover{background:var(--gold2)}
.btn-ghost{background:var(--bg3);color:var(--text2);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4);color:var(--text)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg3);flex-shrink:0}
.btn-icon:hover{background:var(--bg4)}
.btn svg{width:16px;height:16px}

/* ── Tags ── */
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600}
.tag-gold{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-bdr)}
.tag-teal{background:rgba(78,205,196,0.12);color:var(--teal)}
.tag-red{background:rgba(224,85,85,0.12);color:var(--red)}
.tag-blue{background:rgba(91,142,230,0.12);color:var(--blue)}
.tag-gray{background:var(--bg3);color:var(--text3)}

/* ── Avatar ── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;font-size:13px}
.av-sm{width:32px;height:32px;font-size:11px}
.av-md{width:40px;height:40px}
.av-lg{width:56px;height:56px;font-size:18px}

/* ── List rows ── */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--bg3)}
.row:last-child{border:none}
.row-info{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:12px;color:var(--text3);margin-top:2px}

/* ── Input ── */
.inp{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--text);outline:none;transition:border-color 0.15s}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--text3)}
select.inp option{background:var(--bg2)}
.form-lbl{font-size:12px;color:var(--text3);margin-bottom:6px;display:block;font-weight:500}
.form-grp{margin-bottom:16px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3);stroke-width:2}
.search-inp{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:50px;padding:10px 14px 10px 38px;font-size:14px;color:var(--text);outline:none}
.search-inp:focus{border-color:var(--gold)}
.search-inp::placeholder{color:var(--text3)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:flex;align-items:flex-end;padding:0}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:24px 20px 40px}
.modal-handle{width:36px;height:4px;background:var(--bg4);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}

/* ── Toast ── */
.toast{position:fixed;bottom:calc(var(--nav-h) + 12px);left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--bg4);border-radius:50px;padding:10px 20px;font-size:14px;font-weight:500;z-index:200;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.5)}

/* ── Login ── */
.login-screen{min-height:100vh;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px}
.login-logo{width:80px;height:80px;background:var(--gold);border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:24px;box-shadow:0 0 60px rgba(200,168,75,0.4)}
.login-title{font-size:32px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px}
.login-sub{font-size:16px;color:var(--text3);margin-bottom:40px}
.pin-dots{display:flex;gap:14px;justify-content:center;margin:24px 0}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--bg4);transition:all 0.2s}
.pin-dot.filled{background:var(--gold);border-color:var(--gold)}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.pin-key{height:68px;border-radius:14px;background:var(--bg3);font-size:22px;font-weight:600;transition:all 0.1s;border:1px solid var(--bg4)}
.pin-key:active{background:var(--bg4);transform:scale(0.95)}

/* ── Dashboard hero ── */
.hero{background:linear-gradient(135deg,rgba(200,168,75,0.15) 0%,rgba(200,168,75,0.03) 100%);border:1px solid var(--gold-bdr);border-radius:var(--rl);padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:150px;height:150px;background:var(--gold);opacity:0.05;border-radius:50%}
.hero-label{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px}
.hero-date{font-size:24px;font-weight:800;letter-spacing:-0.5px;margin-bottom:4px}
.hero-culto{font-size:14px;color:var(--text2);margin-bottom:14px}
.hero-funcao{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#000;padding:6px 14px;border-radius:50px;font-size:13px;font-weight:700}

/* ── Escala card ── */
.escala-card{background:var(--surface);border:1px solid var(--bg3);border-radius:var(--rl);overflow:hidden;margin-bottom:12px}
.escala-header{padding:14px 16px;border-bottom:1px solid var(--bg3);display:flex;align-items:center;justify-content:space-between}
.escala-date{font-size:16px;font-weight:700}
.escala-culto{font-size:12px;color:var(--text3);margin-top:2px}
.escala-body{padding:14px 16px}
.escala-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--bg3)}
.escala-row:last-child{border:none}
.escala-role{font-size:12px;color:var(--text3);width:90px;flex-shrink:0;padding-top:1px}
.escala-val{font-size:13px;font-weight:500;flex:1}

/* ── Música row ── */
.musica-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg3)}
.musica-row:last-child{border:none}
.musica-thumb{width:44px;height:44px;border-radius:8px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.musica-thumb img{width:100%;height:100%;object-fit:cover}
.musica-info{flex:1;min-width:0}
.musica-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.musica-artist{font-size:12px;color:var(--text3);margin-top:2px}
.tom-badge{background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold-bdr);padding:4px 10px;border-radius:50px;font-size:12px;font-weight:600;flex-shrink:0}
.play-circle{width:36px;height:36px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;border:none}
.play-circle svg{width:14px;height:14px;color:#000;fill:#000}

/* ── Escala tabs ── */
.tabs{display:flex;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;border-radius:8px;color:var(--text3);cursor:pointer;transition:all 0.15s}
.tab.active{background:var(--bg);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,0.3)}

/* ── Stem row ── */
.stem-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg3)}
.stem-row:last-child{border:none}
.stem-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stem-icon svg{width:16px;height:16px}
.stem-name{font-size:14px;font-weight:500;width:130px;flex-shrink:0}
.stem-bar-bg{flex:1;height:4px;background:var(--bg4);border-radius:2px;cursor:pointer}
.stem-bar-fill{height:100%;border-radius:2px;transition:width 0.2s}
.stem-vol{font-size:11px;color:var(--text3);width:28px;text-align:right}
.stem-btn{width:30px;height:30px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
.stem-btn:hover{background:var(--bg4)}
.stem-btn svg{width:14px;height:14px}
.stem-btn.muted{background:rgba(224,85,85,0.15);color:var(--red)}

/* ── Player embutido ── */
.player-embed{position:fixed;bottom:var(--nav-h);left:0;right:0;background:var(--bg2);border-top:1px solid var(--bg3);z-index:15}
.player-embed-header{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer}
.player-embed-video{width:100%;aspect-ratio:16/9;display:block;border:none}
.player-embed-collapsed{height:60px}
@media(min-width:680px){.player-embed{left:220px}}
.player-bar{position:fixed;bottom:var(--nav-h);left:0;right:0;background:rgba(22,22,22,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--bg3);padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:15}
.player-thumb{width:40px;height:40px;border-radius:8px;background:var(--bg3);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.player-info{flex:1;min-width:0}
.player-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-artist{font-size:11px;color:var(--text3)}
.player-close{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ── Tom keys ── */
.tom-grid{display:flex;flex-wrap:wrap;gap:6px}
.tom-key{width:52px;height:44px;border-radius:10px;background:var(--bg3);border:1px solid var(--bg4);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all 0.12s;display:flex;align-items:center;justify-content:center}
.tom-key:hover{border-color:var(--gold);color:var(--gold)}
.tom-key.active{background:var(--gold);color:#000;border-color:var(--gold)}

/* ── Stats ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--bg3);border-radius:var(--r);padding:16px}
.stat-val{font-size:28px;font-weight:800;letter-spacing:-0.5px}
.stat-lbl{font-size:12px;color:var(--text3);margin-top:4px}

/* ── Aviso card ── */
.aviso-card{border-radius:var(--r);padding:16px;margin-bottom:10px;border-left:3px solid var(--gold)}
.aviso-card.info{background:var(--surface);border-left-color:var(--blue)}
.aviso-card.alerta{background:var(--surface);border-left-color:var(--gold)}
.aviso-card.lido{opacity:0.5}

/* ── Upload ── */
.upload-area{border:2px dashed var(--bg4);border-radius:var(--rl);padding:40px 20px;text-align:center;cursor:pointer;transition:border-color 0.15s}
.upload-area:hover,.upload-area.drag{border-color:var(--gold)}
.upload-area svg{width:40px;height:40px;color:var(--text3);margin-bottom:12px}

/* ── Responsive ── */
@media(min-width:680px){
  .shell{flex-direction:row}
  .bottomnav{display:none}
  .content{padding:24px;padding-bottom:24px}
  .sidebar-desktop{width:220px;background:var(--bg2);border-right:1px solid var(--bg3);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
  .sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--bg3)}
  .sidebar-nav{flex:1;overflow-y:auto;padding:12px}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text3);cursor:pointer;margin-bottom:2px;transition:all 0.12s}
  .sidebar-item:hover{background:var(--bg3);color:var(--text)}
  .sidebar-item.active{background:var(--gold-bg);color:var(--gold)}
  .sidebar-item svg{width:18px;height:18px;flex-shrink:0}
  .sidebar-footer{padding:16px;border-top:1px solid var(--bg3)}
  .player-bar{left:220px}
}
@media(max-width:679px){
  .sidebar-desktop{display:none}
  .stats-grid{grid-template-columns:1fr 1fr}
}

/* ── Confirmação presença ── */
.conf-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bg3)}
.conf-row:last-child{border:none}
.conf-btn{padding:5px 12px;border-radius:50px;font-size:12px;font-weight:600;border:1px solid var(--bg4);background:var(--bg3);color:var(--text3);cursor:pointer;transition:all 0.12s}
.conf-btn.yes{background:rgba(92,184,92,0.15);color:var(--green);border-color:rgba(92,184,92,0.3)}
.conf-btn.no{background:rgba(224,85,85,0.12);color:var(--red);border-color:rgba(224,85,85,0.3)}
.conf-btn:hover{opacity:0.8}

/* ── Modo ensaio ── */
.ensaio-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;overflow:hidden}
.ensaio-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:rgba(0,0,0,0.9);flex-shrink:0}
.ensaio-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
.ensaio-nav{padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:16px;background:rgba(0,0,0,0.9);flex-shrink:0}
.ensaio-nav button{width:56px;height:56px;border-radius:50%;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* ── Capotraste ── */
.capo-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(91,142,230,0.12);color:var(--blue);padding:3px 10px;border-radius:50px;font-size:11px;font-weight:600}

/* ── Observações ── */
.obs-area{width:100%;background:var(--bg3);border:1px solid var(--bg4);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);outline:none;resize:vertical;min-height:60px;font-family:inherit}
.obs-area:focus{border-color:var(--gold)}
.obs-area::placeholder{color:var(--text3)}

/* ── Reorder ── */
.reorder-btn{width:24px;height:24px;border-radius:6px;background:var(--bg3);border:1px solid var(--bg4);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text3);font-size:14px;flex-shrink:0}
.reorder-btn:hover{background:var(--bg4);color:var(--text)}

</style>
</head>

/* ─── HELPERS ─────────────────────────────────── */
const norm = s => s?.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim()||'';

const parseData = str => {
  if (!str) return new Date(0);
  const p = str.trim().split('/');
  if (p.length < 3) return new Date(0);
  const dt = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]), 12, 0, 0);
  return isNaN(dt.getTime()) ? new Date(0) : dt;
};

const hojeMs = () => {
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
};

const funcaoNaEscala = (nome, e) => {
  if (!nome || !e) return null;
  const n = norm(nome);
  const vars = new Set([n]);
  n.split(' ').filter(p=>p.length>2).forEach(p=>{
    vars.add(p);
    if(p.length>=4) vars.add(p.slice(0,4));
    if(p.length>=5) vars.add(p.slice(0,5));
  });
  if(n.includes('pastor')||n.startsWith('pr')){
    n.split(' ').filter(p=>p.length>2&&!['pastor','pastora','pr'].includes(p)).forEach(p=>{
      vars.add('pr-'+p); vars.add('pr '+p);
    });
  }
  const hit = campo => campo && [...vars].some(v=>v.length>=3&&norm(campo).includes(v));
  const fs = [];
  if(hit(e.ministerio)) fs.push('Ministro(a)');
  if(hit(e.vocal))      fs.push('Vocal / Back');
  if(hit(e.musicos?.guitarra)) fs.push('Guitarra');
  if(hit(e.musicos?.teclado))  fs.push('Teclado');
  if(hit(e.musicos?.baixo))    fs.push('Baixo');
  if(hit(e.musicos?.bateria))  fs.push('Bateria');
  if(hit(e.musicos?.violao))   fs.push('Violão');
  return fs.length ? fs.join(' · ') : null;
};

const escalasDoUsuario = (nome, escalas) => {
  const hoje = hojeMs();
  return escalas
    .filter(e => funcaoNaEscala(nome,e) && parseData(e.data).getTime() >= hoje)
    .sort((a,b) => parseData(a.data)-parseData(b.data));
};

const proxEscalaGeral = escalas => {
  const hoje = hojeMs();
  return escalas
    .filter(e => parseData(e.data).getTime() >= hoje)
    .sort((a,b) => parseData(a.data)-parseData(b.data))[0]||null;
};

const initials = n => n.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();

const formatData = str => {
  if (!str) return '';
  const p = str.split('/');
  const dias = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const d = new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0]));
  return `${dias[d.getDay()]}, ${parseInt(p[0])} ${meses[d.getMonth()]}`;
};

      headers: {apikey:SB_KEY, Authorization:`Bearer ${SB_KEY}`, 'Content-Type':'application/json', Prefer:'return=representation', ...opts.headers}

};

};

/* ─── MINI PLAYER YOUTUBE ─────────────────────── */
function PlayerYT({musica,onClose}){
  const [vid,setVid]=useState(musica?.youtubeId||null);
  const [loading,setLoading]=useState(!musica?.youtubeId);

  useEffect(()=>{
    if(!musica) return;
    if(musica.youtubeId){setVid(musica.youtubeId);setLoading(false);return;}
    setLoading(true);
    const q=encodeURIComponent(`${musica.nome} ${musica.artista} oficial`);
    fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${q}&type=video&maxResults=1&key=${YT_KEY}`)
      .then(r=>r.json())
      .then(d=>{const id=d.items?.[0]?.id?.videoId;if(id)setVid(id);})
      .catch(()=>{})
      .finally(()=>setLoading(false));
  },[musica?.id]);

  if(!musica) return null;
  const isMob=window.innerWidth<680;
  return (
    <div style={{
      position:'fixed',bottom:isMob?64:0,left:isMob?0:220,right:0,zIndex:200,
      background:'rgba(10,10,10,0.98)',borderTop:'1px solid var(--bg3)',
      boxShadow:'0 -8px 40px rgba(0,0,0,0.8)',
    }}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 16px',borderBottom:'1px solid var(--bg3)'}}>

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{musica.nome}</div>
          <div style={{fontSize:12,color:'var(--text3)'}}>{musica.artista} · Tom: {musica.tom}</div>
        </div>
        {loading&&<span style={{fontSize:12,color:'var(--text3)',flexShrink:0}}>Buscando...</span>}
        <button onClick={onClose} style={{width:32,height:32,borderRadius:50,background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',border:'none',cursor:'pointer',flexShrink:0}}>
          <Ico n="x" s={16} c="var(--text3)"/>
        </button>
      </div>
      {/* Iframe YouTube embutido — abre direto */}
      {vid&&!loading&&(
        <div style={{position:'relative',paddingBottom:'56.25%',height:0,overflow:'hidden'}}>
          <iframe
            src={`https://www.youtube.com/embed/${vid}?autoplay=1&rel=0`}
            style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',border:'none'}}
            allow="autoplay; encrypted-media; picture-in-picture"
            allowFullScreen
          />
        </div>
      )}
      {!vid&&!loading&&(
        <div style={{padding:'20px',textAlign:'center',color:'var(--text3)',fontSize:13}}>
          Vídeo não encontrado.
          <a href={`https://www.youtube.com/results?search_query=${encodeURIComponent(musica.nome+' '+musica.artista)}`}
            target="_blank" rel="noreferrer"
            style={{color:'var(--gold)',marginLeft:8,fontSize:12}}>
            Buscar no YouTube ↗
          </a>
        </div>
      )}
    </div>
  );
}

function TelaLogin({membros,onLogin}){
  const [step,setStep]=useState('nome');

  const [err,setErr]=useState('');
  const [busca,setBusca]=useState('');

  const filtrados=membros.filter(m=>m.nome.toLowerCase().includes(busca.toLowerCase()));

  const selecionarMembro=m=>{setSel(m);setPin('');setErr('');setStep('pin');};
  const adicionarDigito=d=>{
    if(pin.length>=4) return;
    const novo=pin+d;
    setPin(novo);
    if(novo.length===4){
      setTimeout(()=>{
        if(novo===sel.pin) onLogin(sel);

      },150);
    }

          <div style={{fontSize:24,fontWeight:800,color:'var(--gold)',letterSpacing:'-0.5px'}}>Harpa</div>
          <div style={{fontSize:13,color:'var(--text3)',marginTop:4}}>Ministério de Louvor</div>
        </div>

        {step==='nome'&&(
          <>
            <div style={{fontSize:15,fontWeight:600,color:'var(--text)',marginBottom:4,textAlign:'center'}}>Quem é você?</div>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:16,textAlign:'center'}}>Selecione seu nome</div>
            <div className="search-wrap" style={{marginBottom:12}}>
              <Ico n="search"/>
              <input className="search-inp" placeholder="Buscar nome..." value={busca} onChange={e=>setBusca(e.target.value)} autoFocus/>
            </div>
            <div style={{maxHeight:'50vh',overflowY:'auto',display:'flex',flexDirection:'column',gap:6}}>

                  <div className="av av-md" style={{background:m.cor+'22',color:m.cor}}>{initials(m.nome)}</div>
                  <div style={{flex:1}}>
                    <div style={{fontSize:15,fontWeight:600}}>{m.nome}</div>
                    <div style={{fontSize:12,color:'var(--text3)'}}>{m.papel}</div>
                  </div>
                  <Ico n="chevron" s={16} c="var(--text3)"/>

        {step==='pin'&&sel&&(
          <div style={{textAlign:'center'}}>

              ← Voltar

  const playMusica=m=>{
    const full=musicas.find(x=>x.id===m.musicaId)||musicas.find(x=>x.nome===m.nome)||m;
    onPlay({...m,...full,tom:m.tom}); // mantém o tom da escala

  const addMusica=async m=>{
    if(!proxMinha) return;
    const nova={id:Date.now(),musicaId:m.id,nome:m.nome,artista:m.artista,tom:m.tom,capa:m.capa||'',youtubeId:m.youtubeId||''};

    if(!proxMinha) return;

/* ─── ESCALAS ─────────────────────────────────── */
function Escalas({escalas,setEscalas,salvarEscala,excluirEscala,atualizarRep,musicas,salvarAviso,usuario}){
  const isMin=usuario.acesso==='admin'||usuario.acesso==='ministro';
  const isAdmin=usuario.acesso==='admin';
  const [sel,setSel]=useState(null);
  const [aba,setAba]=useState('time');
  const [modalEsc,setModalEsc]=useState(false);
  const [editEsc,setEditEsc]=useState(null);
  const [modalMus,setModalMus]=useState(false);
  const [busMus,setBusMus]=useState('');
  const [editTom,setEditTom]=useState(null);
  const [salvando,setSalvando]=useState(false);
  const [toast,setToast]=useState('');
  const [ensaio,setEnsaio]=useState(false); // modo ensaio fullscreen
  const [ensaioIdx,setEnsaioIdx]=useState(0);
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2500)};
  const MEMBROS_NOMES=['Pastor Éder','Pastora Hilda','Pastor Igor','Fran','Guilherme','Keith','Kimberly','Lucimara','Fabi','Hilma','Mara','Luciel','Katryel','Fagner','Miguel','Pablo','Nanda','Luiz','Gustavo','Wesley Fábio'];

  const fBase={data:'',dia:'Domingo',culto:'2 cultos',ceia:false,ministerio:'',vocal:'',musicos:{baixo:'',guitarra:'',teclado:'',bateria:''},repertorio:[],observacoes:''};
  const [fEsc,setFEsc]=useState(fBase);

  const hoje=hojeMs();
  const futuras=escalas.filter(e=>parseData(e.data).getTime()>=hoje).sort((a,b)=>parseData(a.data)-parseData(b.data));
  const passadas=escalas.filter(e=>parseData(e.data).getTime()<hoje).sort((a,b)=>parseData(b.data)-parseData(a.data));

  const selAtual=escalas.find(e=>e.id===sel?.id)||sel;
  const rep=selAtual?.repertorio||[];

  const abrirEditar=e=>{setEditEsc(e);setFEsc({data:e.data,dia:e.dia,culto:e.culto,ceia:e.ceia||false,ministerio:e.ministerio||'',vocal:e.vocal||'',musicos:{...e.musicos},repertorio:e.repertorio||[],observacoes:e.observacoes||''});setModalEsc(true);};
  const salvar=async()=>{
    if(!fEsc.data.trim()) return;
    setSalvando(true);
    try{
      const base=editEsc?{...editEsc,...fEsc}:{...fEsc,confirmacoes:{}};
      const saved=await salvarEscala(base);
      setSel(saved||base);
      showToast(editEsc?'Escala atualizada!':'Escala criada!');
      setModalEsc(false);
    }catch(e){showToast('Erro: '+e.message);}
    finally{setSalvando(false);}
  };

  // Duplicar escala
  const duplicarEscala=e=>{
    setEditEsc(null);
    setFEsc({...fBase,dia:e.dia,culto:e.culto,ceia:e.ceia,ministerio:e.ministerio,vocal:e.vocal,musicos:{...e.musicos},observacoes:e.observacoes||''});
    setModalEsc(true);
    showToast('Preencha a nova data e ajuste se necessário.');
  };

  // Confirmar presença
  const confirmar=async(escala,nome,status)=>{
    const confs={...(escala.confirmacoes||{}), [nome]:status};
    try{
      await salvarEscala({...escala,confirmacoes:confs});
      showToast(status==='sim'?'Presença confirmada!':'Indisponibilidade registrada.');
    }catch(e){showToast('Erro: '+e.message);}
  };

  // Salvar observações
  const salvarObs=async(escala,obs)=>{
    try{await salvarEscala({...escala,observacoes:obs});}catch(e){showToast('Erro: '+e.message);}
  };

  // Reordenar músicas no repertório
  const moverMusica=async(idx,dir)=>{
    const rep=[...(selAtual.repertorio||[])];
    const newIdx=idx+dir;
    if(newIdx<0||newIdx>=rep.length) return;
    [rep[idx],rep[newIdx]]=[rep[newIdx],rep[idx]];
    await atualizarRep(selAtual.id,rep);
  };

  const addMusica=async m=>{
    const nova={id:Date.now(),musicaId:m.id,nome:m.nome,artista:m.artista,tom:m.tom};
    const novoRep=[...rep,nova];
    await atualizarRep(selAtual.id,novoRep);
    setModalMus(false);setBusMus('');
    showToast(`"${m.nome}" adicionada!`);
  };
  const remMusica=async entrada=>{
    const novoRep=rep.filter(r=>r.id!==entrada.id);
    await atualizarRep(selAtual.id,novoRep);
    showToast('Música removida.');
  };
  const mudarTom=async(entrada,tom)=>{
    const novoRep=rep.map(r=>r.id===entrada.id?{...r,tom}:r);
    await atualizarRep(selAtual.id,novoRep);
    setEditTom(null);
    showToast('Tom alterado!');
  };
  const notificar=async()=>{
    if(!rep.length){showToast('Adicione músicas primeiro.');return;}
    const lista=rep.map((m,i)=>`${i+1}. ${m.nome} (${m.tom})`).join(' · ');
    await salvarAviso({titulo:`Repertório — ${sel.dia} ${sel.data}`,corpo:`Culto: ${sel.culto}. ${lista}`,tipo:'info',destinatario:'todos',autor:usuario.nome,link:'escalas',link_id:String(sel.id),link_label:`Ver escala — ${sel.data}`});
    showToast('Equipe notificada!');
  };

  const EscalaItem=({e})=>(
    <button onClick={()=>{setSel(e);setAba('time');}}
      style={{width:'100%',display:'flex',alignItems:'center',gap:12,padding:'14px',borderRadius:12,background:sel?.id===e.id?'rgba(200,168,75,0.08)':'var(--surface)',border:`1px solid ${sel?.id===e.id?'var(--gold-bdr)':'var(--bg3)'}`,cursor:'pointer',textAlign:'left',marginBottom:8,transition:'all 0.12s'}}
    >

  return(

      {isMin&&(
        <div style={{marginBottom:20}}>
          <button className="btn btn-gold" style={{width:'100%',justifyContent:'center'}} onClick={()=>{setEditEsc(null);setFEsc(fBase);setModalEsc(true);}}>

      {/* Modal escala */}
      {modalEsc&&(

          <div className="modal">
            <div className="modal-handle"/>
            <div className="modal-title">
              {editEsc?'Editar escala':'Nova escala'}

/* ─── MÚSICAS ─────────────────────────────────── */
function Musicas({musicas,salvarMusica,excluirMusica,onPlay,usuario}){
  const isMin=usuario.acesso==='admin'||usuario.acesso==='ministro';
  const isAdmin=usuario.acesso==='admin';
  const [busca,setBusca]=useState('');
  const [modal,setModal]=useState(false);
  const [aba,setAba]=useState('yt');
  const [editando,setEditando]=useState(null);
  const [form,setForm]=useState({nome:'',artista:'',tom:'Ré',bpm:'',youtubeId:'',capa:'',cifraUrl:''});
  const [ytQ,setYtQ]=useState('');
  const [ytRes,setYtRes]=useState([]);
  const [ytSel,setYtSel]=useState(null);
  const [ytLoad,setYtLoad]=useState(false);
  const [salvando,setSalvando]=useState(false);
  const [toast,setToast]=useState('');
  const ytTimer=useRef(null);
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2500)};

  const filtradas=musicas.filter(m=>m.nome.toLowerCase().includes(busca.toLowerCase())||m.artista.toLowerCase().includes(busca.toLowerCase()));

  const buscarYT=async q=>{
    if(!q.trim()){setYtRes([]);return;}
    setYtLoad(true);
    try{
      // Busca o mais específico possível — sem "louvor gospel" para não distorcer
      const res=await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(q)}&type=video&maxResults=6&key=${YT_KEY}&relevanceLanguage=pt`);
      const d=await res.json();
      if(!res.ok) throw new Error(d.error?.message||'Erro');
      const ids=d.items.map(i=>i.id.videoId).join(',');
      const det=await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${ids}&key=${YT_KEY}`);
      const dd=await det.json();
      const durs={};
      (dd.items||[]).forEach(it=>{
        const iso=it.contentDetails.duration;
        const m2=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
        if(m2){const h=parseInt(m2[1]||0),m=parseInt(m2[2]||0),s=parseInt(m2[3]||0);durs[it.id]=`${h*60+m}:${String(s).padStart(2,'0')}`;}
      });
      setYtRes(d.items.map(it=>({
        id:it.id.videoId,
        titulo:it.snippet.title,
        canal:it.snippet.channelTitle,
        thumb:it.snippet.thumbnails.medium?.url||it.snippet.thumbnails.default?.url,
        dur:durs[it.id.videoId]||'',
      })));
    }catch(e){console.warn(e);}
    finally{setYtLoad(false);}
  };

  const onYtQ=v=>{
    setYtQ(v);setYtSel(null);
    clearTimeout(ytTimer.current);
    ytTimer.current=setTimeout(()=>buscarYT(v),700);
  };

  const selecionarYT=it=>{
    setYtSel(it);
    // Extrai nome/artista do título — formato comum: "Nome - Artista" ou "Nome | Artista"
    const sep=it.titulo.match(/(.*?)[\-–|](.*)/);
    setForm(f=>({...f,
      nome:(sep?sep[1]:it.titulo).trim(),
      artista:(sep?sep[2]:it.canal).trim().replace(/\s*(Oficial|Official|HD|Vídeo|Video)\s*/gi,'').trim(),
      youtubeId:it.id,
      capa:it.thumb,
    }));
  };

  const abrirNovo=()=>{setEditando(null);setForm({nome:'',artista:'',tom:'Ré',bpm:'',youtubeId:'',capa:'',cifraUrl:''});setYtQ('');setYtRes([]);setYtSel(null);setAba('yt');setModal(true);};
  const abrirEditar=m=>{setEditando(m);setForm({nome:m.nome,artista:m.artista,tom:m.tom,bpm:m.bpm||'',youtubeId:m.youtubeId||'',capa:m.capa||'',cifraUrl:m.cifraUrl||''});setAba('manual');setModal(true);};

/* ─── AVISOS ──────────────────────────────────── */
function Avisos({avisos,setAvisos,salvarAviso,excluirAviso,membros,usuario,onPage}){
  const isMin=usuario.acesso==='admin'||usuario.acesso==='ministro';
  const isAdmin=usuario.acesso==='admin';
  const [modal,setModal]=useState(false);
  const [edit,setEdit]=useState(null);
  const [form,setForm]=useState({titulo:'',corpo:'',tipo:'info',destinatario:'todos'});
  const [salvando,setSalvando]=useState(false);
  const [toast,setToast]=useState('');
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2500)};

  const marcarLido=id=>setAvisos(a=>a.map(x=>x.id===id?{...x,lido:true}:x));
  const marcarTodos=()=>setAvisos(a=>a.map(x=>({...x,lido:true})));

  const abrir=(a=null)=>{
    setEdit(a);
    setForm(a?{titulo:a.titulo,corpo:a.corpo,tipo:a.tipo,destinatario:a.destinatario||'todos'}:{titulo:'',corpo:'',tipo:'info',destinatario:'todos'});
    setModal(true);
  };

  const salvar=async()=>{
    if(!form.titulo.trim()) return;
    setSalvando(true);
    try{
      await salvarAviso({...(edit||{}), ...form, autor:usuario.nome});
      showToast(edit?'Aviso atualizado!':'Aviso enviado!');
      setModal(false);
    }catch(e){showToast('Erro: '+e.message);}
    finally{setSalvando(false);}
  };

  return(
    <div>
      <Toast msg={toast}/>
      <div style={{display:'flex',gap:10,marginBottom:20}}>
        {isMin&&<button className="btn btn-gold btn-sm" onClick={()=>abrir()}><Ico n="plus" s={16}/>Novo aviso</button>}
        {avisos.some(a=>!a.lido)&&<button className="btn btn-ghost btn-sm" onClick={marcarTodos}><Ico n="check" s={16}/>Todos lidos</button>}
      </div>

      {avisos.length===0&&<div style={{textAlign:'center',padding:'40px 0',color:'var(--text3)',fontSize:14}}>Nenhum aviso.</div>}

      {avisos.map(a=>(
        <div key={a.id} className={`aviso-card ${a.tipo}${a.lido?' lido':''}`} style={{marginBottom:12}}>
          <div style={{display:'flex',gap:10}}>
            <Ico n={a.tipo==='alerta'?'alert':'info'} s={18} c={a.tipo==='alerta'?'var(--gold)':'var(--blue)'} st={{flexShrink:0,marginTop:1}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:15,fontWeight:700,marginBottom:4}}>{a.titulo}</div>
              <div style={{fontSize:13,color:'var(--text3)',lineHeight:1.5}}>{a.corpo}</div>
              {a.destinatario&&a.destinatario!=='todos'&&<div style={{fontSize:11,color:'var(--text3)',marginTop:6}}>Para: <strong>{a.destinatario}</strong></div>}
              {a.link&&onPage&&(
                <button onClick={()=>{marcarLido(a.id);onPage(a.link);}}
                  style={{marginTop:10,display:'inline-flex',alignItems:'center',gap:6,background:'var(--gold-bg)',border:'1px solid var(--gold-bdr)',borderRadius:50,padding:'6px 14px',color:'var(--gold)',fontSize:13,fontWeight:600,cursor:'pointer'}}>
                  <Ico n="cal" s={14}/>
                  {a.link_label||'Ver detalhes'} →
                </button>
              )}
              <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
                {!a.lido&&<button className="btn btn-ghost btn-sm" onClick={()=>marcarLido(a.id)}><Ico n="check" s={14}/>Lido</button>}
                {isMin&&<button className="btn btn-ghost btn-sm" onClick={()=>abrir(a)}><Ico n="edit" s={14}/>Editar</button>}
                {isAdmin&&<button className="btn btn-ghost btn-sm" style={{color:'var(--red)'}} onClick={async()=>{await excluirAviso(a.id);showToast('Removido.');}}><Ico n="trash" s={14}/>Excluir</button>}
              </div>
            </div>
            <div style={{fontSize:11,color:'var(--text3)',flexShrink:0}}>{a.data}</div>
          </div>
        </div>
      ))}

      {modal&&(
        <div className="overlay" onClick={e=>{if(e.target.classList.contains('overlay'))setModal(false)}}>
          <div className="modal">
            <div className="modal-handle"/>
            <div className="modal-title">{edit?'Editar aviso':'Novo aviso'}<button onClick={()=>setModal(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)'}}><Ico n="x" s={20}/></button></div>
            <div style={{display:'flex',gap:8,marginBottom:16}}>
              {['info','alerta'].map(t=>(
                <button key={t} className={`btn ${form.tipo===t?'btn-gold':'btn-ghost'} btn-sm`} onClick={()=>setForm(f=>({...f,tipo:t}))}>
                  {t==='alerta'?'⚠ Alerta':'ℹ Info'}
                </button>
              ))}
            </div>
            <div className="form-grp"><label className="form-lbl">Título</label><input className="inp" value={form.titulo} onChange={e=>setForm(f=>({...f,titulo:e.target.value}))} placeholder="Título do aviso" autoFocus/></div>
            <div className="form-grp"><label className="form-lbl">Mensagem</label><textarea className="inp" rows={3} value={form.corpo} onChange={e=>setForm(f=>({...f,corpo:e.target.value}))} placeholder="Detalhes..." style={{resize:'vertical'}}/></div>
            <div className="form-grp">
              <label className="form-lbl">Destinatário</label>
              <select className="inp" value={form.destinatario} onChange={e=>setForm(f=>({...f,destinatario:e.target.value}))}>
                <option value="todos">📢 Todos</option>
                {membros.map(m=><option key={m.id} value={m.nome}>{m.nome}</option>)}
              </select>
            </div>
            <button className="btn btn-gold" style={{width:'100%',justifyContent:'center'}} onClick={salvar} disabled={salvando}>
              <Ico n="send" s={16}/>{salvando?'Enviando...':(edit?'Salvar':'Enviar')}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── MEMBROS ─────────────────────────────────── */
function Membros({membros,salvarMembro,excluirMembro,usuario}){
  const isAdmin=usuario.acesso==='admin';
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({nome:'',papel:'',funcoes:'',pin:'1234'});
  const [salvando,setSalvando]=useState(false);
  const [toast,setToast]=useState('');
  const [busca,setBusca]=useState('');
  const showToast=m=>{setToast(m);setTimeout(()=>setToast(''),2500)};
  const CORES=['#C8A84B','#D85A30','#7F77DD','#5DCAA5','#ED93B1','#5B9BD5','#6BBF6A','#EF9F27','#D4537E','#534AB7'];

  const grupos={
    'Liderança':membros.filter(m=>m.tipo==='liderança'),
    'Ministros':membros.filter(m=>m.tipo==='ministro'),
    'Músicos e Backing':membros.filter(m=>m.tipo==='musico'),
  };

  const salvar=async()=>{
    if(!form.nome.trim()) return;
    setSalvando(true);
    try{
      await salvarMembro({nome:form.nome,papel:form.papel,funcoes:form.funcoes.split(',').map(f=>f.trim()).filter(Boolean),cor:CORES[membros.length%CORES.length],tipo:'musico',pin:form.pin||'1234',acesso:'membro'});
      showToast(`${form.nome} adicionado(a)!`);
      setForm({nome:'',papel:'',funcoes:'',pin:'1234'});
      setModal(false);
    }catch(e){showToast('Erro: '+e.message);}
    finally{setSalvando(false);}
  };

  const filtrados=membros.filter(m=>m.nome.toLowerCase().includes(busca.toLowerCase()));

  return(
    <div>
      <Toast msg={toast}/>
      <div style={{display:'flex',gap:10,marginBottom:20}}>
        <div className="search-wrap" style={{flex:1}}>
          <Ico n="search"/>
          <input className="search-inp" placeholder="Buscar membro..." value={busca} onChange={e=>setBusca(e.target.value)}/>
        </div>
        {isAdmin&&<button className="btn btn-gold btn-sm" onClick={()=>setModal(true)}><Ico n="plus" s={16}/></button>}
      </div>

      {Object.entries(grupos).map(([grupo,lista])=>{
        const f=lista.filter(m=>m.nome.toLowerCase().includes(busca.toLowerCase()));
        if(!f.length) return null;
        return(
          <div key={grupo} style={{marginBottom:24}}>
            <div style={{fontSize:12,color:'var(--text3)',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.8px',marginBottom:10}}>{grupo}</div>
            {f.map(m=>(
              <div key={m.id} className="row">
                <div className="av av-md" style={{background:m.cor+'22',color:m.cor}}>{initials(m.nome)}</div>
                <div className="row-info">
                  <div className="row-title">{m.nome}</div>
                  <div className="row-sub">{m.papel}</div>
                </div>
                <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                  {m.funcoes.slice(0,2).map((f,i)=><span key={i} className="tag tag-gray" style={{fontSize:10}}>{f}</span>)}
                </div>
              </div>
            ))}
          </div>
        );
      })}

      {modal&&(
        <div className="overlay" onClick={e=>{if(e.target.classList.contains('overlay'))setModal(false)}}>
          <div className="modal">
            <div className="modal-handle"/>
            <div className="modal-title">Novo membro<button onClick={()=>setModal(false)} style={{background:'none',border:'none',cursor:'pointer',color:'var(--text3)'}}><Ico n="x" s={20}/></button></div>
            <div className="form-grp"><label className="form-lbl">Nome completo</label><input className="inp" value={form.nome} onChange={e=>setForm(f=>({...f,nome:e.target.value}))} placeholder="Nome" autoFocus/></div>
            <div className="form-grp"><label className="form-lbl">Função</label><input className="inp" value={form.papel} onChange={e=>setForm(f=>({...f,papel:e.target.value}))} placeholder="Ex: Guitarrista"/></div>
            <div className="form-grp"><label className="form-lbl">Instrumentos (separados por vírgula)</label><input className="inp" value={form.funcoes} onChange={e=>setForm(f=>({...f,funcoes:e.target.value}))} placeholder="Ex: Guitarra, Violão"/></div>
            <div className="form-grp"><label className="form-lbl">PIN (4 dígitos)</label><input className="inp" value={form.pin} onChange={e=>setForm(f=>({...f,pin:e.target.value}))} placeholder="1234" maxLength={4}/></div>
            <button className="btn btn-gold" style={{width:'100%',justifyContent:'center'}} onClick={salvar} disabled={salvando}><Ico n="check" s={16}/>{salvando?'Salvando...':'Adicionar'}</button>
          </div>
        </div>
      )}
    </div>
  );
}

              style={{display:'flex',alignItems:'center',gap:12,padding:'14px',borderRadius:12,background:wf===w.id?'var(--gold-bg)':'var(--surface)',border:`1px solid ${wf===w.id?'var(--gold-bdr)':'var(--bg3)'}`,cursor:'pointer',textAlign:'left',transition:'all 0.12s'}}>
              <div style={{width:32,height:32,borderRadius:50,background:wf===w.id?'var(--gold)':'var(--bg4)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Ico n="music" s={14} c={wf===w.id?'#000':'var(--text3)'}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:600,color:wf===w.id?'var(--gold)':'var(--text)'}}>{w.l} {w.rec&&<span className="tag tag-gold" style={{fontSize:10,marginLeft:4}}>Recomendado</span>}</div>
                <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{w.s}</div>
              </div>
              {wf===w.id&&<Ico n="check" s={18} c="var(--gold)"/>}
            </button>
          ))}
        </div>
      </div>

      {/* Upload */}
      <div style={{marginBottom:16}}>
        {st==='idle'?(
          <div className="upload-area" onClick={()=>ref.current.click()}
            onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag');}}
            onDragLeave={e=>e.currentTarget.classList.remove('drag')}
            onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag');const f=e.dataTransfer.files[0];if(f)simular(f);}}>
            <input ref={ref} type="file" accept="audio/*" style={{display:'none'}} onChange={e=>e.target.files[0]&&simular(e.target.files[0])}/>
            <Ico n="up" s={40} st={{display:'block',margin:'0 auto 12px'}}/>
            <div style={{fontSize:16,fontWeight:600,marginBottom:6}}>Carregar áudio</div>
            <div style={{fontSize:13,color:'var(--text3)'}}>MP3, WAV, M4A · Máx 50 MB</div>
          </div>
        ):(
          <div className="card">
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:st!=='done'?16:0}}>
              <div className="musica-thumb"><Ico n="music" s={18} c="var(--text3)"/></div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{arq?.name}</div>
                <div style={{fontSize:12,color:'var(--text3)'}}>{arq?(arq.size/1024/1024).toFixed(1)+' MB':''}</div>
              </div>
              {st==='uploading'&&<span className="tag tag-blue">Enviando...</span>}
              {st==='processing'&&<span className="tag tag-blue">Processando {Math.round(prog)}%</span>}
              {st==='done'&&<span className="tag tag-teal">✓ Pronto</span>}
              <button className="btn-icon" onClick={()=>{clearInterval(tmr.current);setArq(null);setSt('idle');setProg(0);setMutes({});}}><Ico n="x" s={14} c="var(--text3)"/></button>
            </div>

            {(st==='uploading'||st==='processing')&&(
              <div>
                <div style={{height:4,background:'var(--bg4)',borderRadius:2,overflow:'hidden'}}>
                  <div style={{height:'100%',background:'var(--gold)',borderRadius:2,width:`${prog}%`,transition:'width 0.3s'}}/>
                </div>
                <div style={{fontSize:12,color:'var(--text3)',marginTop:8}}>
                  {prog<30?'Enviando arquivo..':prog<70?'Analisando estrutura...':'Isolando instrumentos...'}
                </div>
              </div>
            )}

            {st==='done'&&(
              <>
                <div style={{height:1,background:'var(--bg3)',margin:'14px 0'}}/>
                {stems.map(s=>{
                  const v=vols[s.id]??80; const m=!!mutes[s.id];
                  return(
                    <div key={s.id} className="stem-row">
                      <div className="stem-icon" style={{background:s.bg}}><Ico n="music" s={16} c={s.c}/></div>
                      <div className="stem-name">{s.l}</div>
                      <div className="stem-bar-bg" style={{opacity:m?0.3:1}} onClick={ev=>{const r=ev.currentTarget.getBoundingClientRect();setVols(vv=>({...vv,[s.id]:Math.round(((ev.clientX-r.left)/r.width)*100)}));}}>
                        <div className="stem-bar-fill" style={{width:`${m?0:v}%`,background:s.c}}/>
                      </div>
                      <div className="stem-vol">{m?'—':v}</div>
                      <button className={`stem-btn${m?' muted':''}`} onClick={()=>setMutes(mm=>({...mm,[s.id]:!mm[s.id]}))}><Ico n={m?'mute':'vol'} s={14}/></button>
                      <button className="stem-btn" onClick={()=>showToast(`"${s.l}" — disponível com Lalal.ai`)}><Ico n="dl" s={14}/></button>
                    </div>
                  );
                })}
                <button className="btn btn-gold" style={{width:'100%',justifyContent:'center',marginTop:14}} onClick={()=>showToast('Disponível com Lalal.ai configurado!')}><Ico n="dl" s={16}/>Baixar todas as faixas</button>
              </>
            )}
          </div>
        )}
      </div>

      {/* Transposição */}
      <div className="card">
        <div style={{fontSize:13,color:'var(--text3)',fontWeight:700,marginBottom:14}}>TRANSPOSIÇÃO DE TOM</div>
        <div style={{display:'flex',gap:16,alignItems:'flex-start',flexWrap:'wrap'}}>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Original</div>
            <div className="tom-grid">{TONS.map(t=><button key={t} className={`tom-key${tomA===t?' active':''}`} onClick={()=>setTomA(t)}>{t}</button>)}</div>
          </div>
          <div style={{paddingTop:32,fontSize:20,color:'var(--text3)'}}>→</div>
          <div style={{flex:1}}>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>Destino</div>
            <div className="tom-grid">{TONS.map(t=><button key={t} className={`tom-key${tomB===t?' active':''}`} onClick={()=>setTomB(t)}>{t}</button>)}</div>
          </div>
        </div>
        {tomA!==tomB&&(
          <div style={{marginTop:14,padding:'12px',background:'var(--gold-bg)',border:'1px solid var(--gold-bdr)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div style={{fontSize:14,fontWeight:600}}>{tomA} → {tomB}</div>
            <div style={{fontSize:13,color:'var(--text3)'}}>{sems(tomA,tomB)>0?'+':''}{sems(tomA,tomB)} semitons</div>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [usuario,setUsuario]=useState(null);
  const [page,setPage]=useState('home');
  const [loading,setLoading]=useState(true);
  const [loadMsg,setLoadMsg]=useState('Carregando...');
  const [membros,setMembros]=useState(MEMBROS);
  const [escalas,setEscalas]=useState(ESCALAS_INICIAIS);
  const [musicas,setMusicas]=useState(MUSICAS_INICIAIS);
  const [avisos,setAvisos]=useState(AVISOS_INICIAIS);
  const [player,setPlayer]=useState(null);

  // History API — botão voltar do celular navega dentro do app
  useEffect(()=>{
    const onPop=()=>{
      // Fecha player se aberto
      if(player){setPlayer(null);return;}
      // Volta para home se estiver em outra página
      setPage(p=>{
        if(p!=='home'){
          return 'home';
        }
        // Se já está no home, deixa o navegador fechar
        return p;
      });
    };
    window.addEventListener('popstate',onPop);
    return ()=>window.removeEventListener('popstate',onPop);
  },[player]);

  // Push state quando muda de página
  const navPage=(pg)=>{
    if(pg!==page){
      window.history.pushState({page:pg},'',`#${pg}`);
    }
    setPage(pg);
  };

  // Fechar player também empurra state
  const openPlayer=(m)=>{
    window.history.pushState({player:true},'');
    setPlayer(m);
  };
  const closePlayer=()=>setPlayer(null);

  // Supabase load
  useEffect(()=>{
    async function load(){
      try{
        setLoadMsg('Conectando...');
        const [dbM,dbE,dbMu,dbA]=await Promise.all([
          sb.get('membros','id'), sb.get('escalas','id'),
          sb.get('musicas','id'), sb.get('avisos','criado_em.desc'),
        ]);
        setLoadMsg(`${dbM.length} membros, ${dbE.length} escalas...`);

        if(dbM.length===0){for(const m of MEMBROS)try{await sb.insert('membros',toDb.membro(m))}catch{};const f=await sb.get('membros','id');setMembros(f.length?f.map(fromDb.membro):MEMBROS);}
        else setMembros(dbM.map(fromDb.membro));

        if(dbE.length===0){for(const e of ESCALAS_INICIAIS)try{await sb.insert('escalas',toDb.escala(e))}catch{};const f=await sb.get('escalas','id');setEscalas(f.length?f.map(fromDb.escala):ESCALAS_INICIAIS);}
        else setEscalas(dbE.map(fromDb.escala));

        if(dbMu.length===0){for(const m of MUSICAS_INICIAIS)try{await sb.insert('musicas',toDb.musica(m))}catch{};const f=await sb.get('musicas','id');setMusicas(f.length?f.map(fromDb.musica):MUSICAS_INICIAIS);}
        else setMusicas(dbMu.map(fromDb.musica));

        if(dbA.length===0){for(const a of AVISOS_INICIAIS)try{await sb.insert('avisos',toDb.aviso(a))}catch{}}
        else setAvisos(dbA.map(fromDb.aviso));

      }catch(e){console.error(e);setLoadMsg('Usando dados locais');}
      finally{setLoading(false);}
    }
    load();
  },[]);

  // Push
  const regPush=async nome=>{
    try{
      if(!('serviceWorker'in navigator)||!('PushManager'in window))return;
      const perm=await Notification.requestPermission();
      if(perm!=='granted')return;
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:VAPID});
      const j=sub.toJSON();
      await fetch(`${SB_URL}/rest/v1/push_subscriptions`,{method:'POST',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'resolution=ignore-duplicates'},body:JSON.stringify({membro_nome:nome,endpoint:j.endpoint,p256dh:j.keys?.p256dh,auth:j.keys?.auth})});
    }catch(e){console.warn('Push:',e.message);}
  };

  const doLogin=u=>{setUsuario(u);regPush(u.nome);if(u.acesso==='visualizador')setPage('escalas');};

  // CRUD
  const salvarMembro=async m=>{
    try{
      if(m.id&&m.id<100000){await sb.update('membros',m.id,toDb.membro(m));setMembros(ms=>ms.map(x=>x.id===m.id?m:x));}
      else{const r=await sb.insert('membros',toDb.membro(m));m={...m,id:r.id};setMembros(ms=>[...ms,m]);}
    }catch(e){alert('Erro: '+e.message);}
    return m;
  };
  const excluirMembro=async id=>{try{await sb.delete('membros',id);setMembros(ms=>ms.filter(m=>m.id!==id));}catch(e){alert('Erro: '+e.message);}};

  const salvarEscala=async e=>{
    try{
      if(e.id&&e.id<100000){await sb.update('escalas',e.id,toDb.escala(e));setEscalas(es=>es.map(x=>x.id===e.id?e:x));}
      else{const r=await sb.insert('escalas',toDb.escala(e));e={...e,id:r.id};setEscalas(es=>[...es,e].sort((a,b)=>a.data.localeCompare(b.data)));}
    }catch(ex){alert('Erro: '+ex.message);}
    return e;
  };
  const excluirEscala=async id=>{try{await sb.delete('escalas',id);setEscalas(es=>es.filter(e=>e.id!==id));}catch(e){alert('Erro: '+e.message);}};
  const atualizarRep=async(id,rep)=>{
    try{await sb.update('escalas',id,{repertorio:rep});setEscalas(es=>es.map(e=>e.id===id?{...e,repertorio:rep}:e));}catch(e){alert('Erro: '+e.message);}
  };

  const salvarMusica=async m=>{
    try{
      if(m.id&&m.id<100000){await sb.update('musicas',m.id,toDb.musica(m));setMusicas(ms=>ms.map(x=>x.id===m.id?m:x));}
      else{const r=await sb.insert('musicas',toDb.musica(m));m={...m,id:r.id};setMusicas(ms=>[...ms,m]);}
    }catch(e){alert('Erro: '+e.message);}
    return m;
  };
  const excluirMusica=async id=>{try{await sb.delete('musicas',id);setMusicas(ms=>ms.filter(m=>m.id!==id));}catch(e){alert('Erro: '+e.message);}};

  const salvarAviso=async a=>{
    try{
      if(a.id&&a.id<100000){await sb.update('avisos',a.id,toDb.aviso(a));setAvisos(as=>as.map(x=>x.id===a.id?{...x,...a}:x));}
      else{const r=await sb.insert('avisos',toDb.aviso(a));a={...a,id:r.id,lido:false,data:'Agora'};setAvisos(as=>[a,...as]);
        // Push
        try{await fetch(PUSH_FN,{method:'POST',headers:{Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json'},body:JSON.stringify({titulo:a.titulo,corpo:a.corpo,destinatario:a.destinatario})});}catch{}
      }
    }catch(e){alert('Erro ao salvar aviso: '+e.message);}
    return a;
  };
  const excluirAviso=async id=>{try{await sb.delete('avisos',id);setAvisos(as=>as.filter(a=>a.id!==id));}catch(e){alert('Erro: '+e.message);}};

  if(loading) return(
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
      <div style={{width:64,height:64,borderRadius:18,background:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,boxShadow:'0 0 40px rgba(200,168,75,0.4)'}}>♪</div>
      <div style={{fontSize:20,fontWeight:800,color:'var(--gold)'}}>Harpa</div>
      <div style={{fontSize:13,color:'var(--text3)'}}>{loadMsg}</div>
    </div>
  );

  if(!usuario) return <TelaLogin membros={membros} onLogin={doLogin}/>;

  const isAdmin=usuario.acesso==='admin';
  const avisosVis=usuario.acesso==='admin'||usuario.acesso==='ministro'
    ?avisos
    :avisos.filter(a=>!a.destinatario||a.destinatario==='todos'||a.destinatario===usuario.nome);
  const naoLidos=avisosVis.filter(a=>!a.lido).length;

  const isVis=usuario.acesso==='visualizador';

  const PAGES=isVis?[
    {id:'escalas',l:'Escalas', n:'cal'},
    {id:'musicas',l:'Músicas', n:'music'},
  ]:[
    {id:'home',   l:'Início',  n:'home'},
    {id:'escalas',l:'Escalas', n:'cal'},
    {id:'musicas',l:'Músicas', n:'music'},
    {id:'avisos', l:'Avisos',  n:'bell', badge:naoLidos>0?naoLidos:null},
    {id:'membros',l:'Membros', n:'users'},
  ];

  const titles={home:'Início',escalas:'Escalas',musicas:'Músicas',avisos:'Avisos',membros:'Membros',studio:'Studio',config:'Configurações'};

  const isMobile=window.innerWidth<680;

  return(
    <div className="shell">
      {/* Desktop sidebar */}
      {!isMobile&&(
        <div className="sidebar-desktop">
          <div className="sidebar-logo">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:36,height:36,borderRadius:10,background:'var(--gold)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>♪</div>
              <div>
                <div style={{fontSize:16,fontWeight:800,color:'var(--gold)'}}>Harpa</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>Ministério de Louvor</div>
              </div>
            </div>
          </div>
          <div className="sidebar-nav">
            {PAGES.map(p=>(
              <div key={p.id} className={`sidebar-item${page===p.id?' active':''}`} onClick={()=>navPage(p.id)}>
                <Ico n={p.n} s={18}/>
                {p.l}
                {p.badge&&<span style={{marginLeft:'auto',background:'var(--red)',color:'#fff',fontSize:10,padding:'1px 6px',borderRadius:50,fontWeight:700}}>{p.badge}</span>}
              </div>
            ))}
            {isAdmin&&<div className={`sidebar-item${page==='studio'?' active':''}`} onClick={()=>navPage('studio')}><Ico n="mic" s={18}/>Studio ✦</div>}
            {isAdmin&&<div className={`sidebar-item${page==='config'?' active':''}`} onClick={()=>navPage('config')}><Ico n="gear" s={18}/>Configurações</div>}
          </div>
          <div className="sidebar-footer">
            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <div className="av av-sm" style={{background:usuario.cor+'22',color:usuario.cor}}>{initials(usuario.nome)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{usuario.nome}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>{usuario.papel}</div>
              </div>
              <button onClick={()=>{setUsuario(null);navPage('home');}} className="btn-icon" title="Sair"><Ico n="logout" s={14} c="var(--text3)"/></button>
            </div>
          </div>
        </div>
      )}

      {/* Main */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="topbar">
          <div>
            <div className="topbar-title">{titles[page]||page}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginLeft:'auto'}}>
            {isAdmin&&page==='musicas'&&<button className="btn-icon" onClick={()=>navPage('studio')} title="Studio"><Ico n="mic" s={18} c="var(--text3)"/></button>}
            <div className="av av-sm" style={{background:usuario.cor+'22',color:usuario.cor,cursor:'pointer'}} onClick={()=>{setUsuario(null);navPage('home');}} title="Sair">{initials(usuario.nome)}</div>
          </div>
        </div>

        <div className="content">
          {page==='home'    &&!isVis&&<Dashboard usuario={usuario} escalas={escalas} musicas={musicas} avisos={avisosVis} onPage={navPage} onPlay={openPlayer} atualizarRep={atualizarRep}/>}
          {page==='escalas' &&<Escalas escalas={escalas} setEscalas={setEscalas} salvarEscala={salvarEscala} excluirEscala={excluirEscala} atualizarRep={atualizarRep} musicas={musicas} salvarAviso={salvarAviso} usuario={usuario}/>}
          {page==='musicas' &&<Musicas musicas={musicas} salvarMusica={salvarMusica} excluirMusica={excluirMusica} onPlay={openPlayer} usuario={usuario}/>}
          {page==='avisos'  &&!isVis&&<Avisos avisos={avisosVis} setAvisos={setAvisos} salvarAviso={salvarAviso} excluirAviso={excluirAviso} membros={membros} usuario={usuario} onPage={navPage}/>}
          {page==='membros' &&!isVis&&<Membros membros={membros} salvarMembro={salvarMembro} excluirMembro={excluirMembro} usuario={usuario}/>}
          {page==='studio'  &&!isVis&&<Studio/>}
          {page==='config'  &&isAdmin&&<Config membros={membros} usuario={usuario}/>}
        </div>
      </div>

      {/* Player */}
      {player&&<PlayerYT musica={player} onClose={closePlayer}/>}

      {/* Bottom nav mobile */}
      {isMobile&&(
        <div className="bottomnav">
          {PAGES.map(p=>(
            <button key={p.id} className={`nav-btn${page===p.id?' active':''}`} onClick={()=>navPage(p.id)}>
              <Ico n={p.n} s={22}/>
              <span>{p.l}</span>
              {p.badge&&<span className="nav-dot"/>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
if('serviceWorker'in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{
      reg.update();
      reg.addEventListener('updatefound',()=>{
        const nw=reg.installing;
        nw.addEventListener('statechange',()=>{
          if(nw.state==='installed'&&navigator.serviceWorker.controller){nw.postMessage({type:'SKIP_WAITING'});}
        });
      });
    }).catch(e=>console.log('SW:',e));
    navigator.serviceWorker.addEventListener('controllerchange',()=>window.location.reload());
  });
}
</script>
</body>
</html>
